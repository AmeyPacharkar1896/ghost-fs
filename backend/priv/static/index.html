<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostFS // Secure Tuner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="tuner-overlay">
    <div class="tuner-box">
      <h2>>> HARDWARE TUNING REQUIRED <<< /h2>
          <p>ENTER TARGET FREQUENCY:</p>
          <input type="text" id="freq-input" placeholder="e.g. 847.29" autocomplete="off">
          <button id="tune-btn">[ LOCK SIGNAL ]</button>
    </div>
  </div>

  <div class="terminal">
    <div class="header">
      <h1>GHOST_FS :: TACTICAL RELAY</h1>
      <p id="status" class="blink">> WAITING FOR ENCRYPTED TRANSMISSION...</p>
    </div>

    <div class="visualizer-container">
      <canvas id="feed" width="1280" height="720"></canvas>
      <div class="scanlines"></div>

      <div id="dead-signal-overlay" class="hidden">
        <div class="tuner-box error-box">
          <h2 class="danger blink">>> FREQUENCY BURNED <<< /h2>
              <p>HOST HAS SCORCHED THIS CHANNEL.</p>
              <button id="retune-btn">[ INITIATE RETUNE ]</button>
        </div>
      </div>
    </div>

    <div id="extraction-zone" class="hidden">
      <p>> PAYLOAD DECRYPTED. SECURE CHANNEL CLOSING.</p>
      <p id="timer" class="danger">TIME TO DELETION: 15.00s</p>
      <button id="download-btn">[ EXTRACT PAYLOAD ]</button>
    </div>

    <div id="log-console"></div>
  </div>

  <script src="main.js"></script>
</body>

</html>
